services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks: [default]

  n8n:
    image: n8nio/n8n:2.30.8
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    user: "1000:1000"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: strongpassword
      N8N_HOST: n8n.ansarisaif.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.ansarisaif.com/
      N8N_ENCRYPTION_KEY: d726a50481620bfc116ccea32e36479371d0bdd2b1e7faaa16263d14d5d28ec2
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Asia/Kolkata
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 30
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_METRICS_INCLUDE_WEBHOOK_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_INFO: "true"
      N8N_METRICS_INCLUDE_SCHEDULER_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
      N8N_OTEL_ENABLED: "true"
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      N8N_OTEL_EXPORTER_SERVICE_NAME: "n8n"
      N8N_OTEL_TRACES_INCLUDE_NODE_SPANS: "true"
      N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"
      N8N_PYTHON_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: Q4rs7ZN3qomN
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - ./data:/home/node/.n8n
    depends_on:
      - postgres
    networks: [default, observability]

  python-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-n8n-runners:2.30.8
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: Q4rs7ZN3qomN
    depends_on:
      - n8n
    networks: [default]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./promtail-data:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9080:9080"
    depends_on:
      - n8n
    networks: [default, observability]

networks:
  default:
  observability:
    external: true
    name: medinexplus_default
