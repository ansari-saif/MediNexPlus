name: Deploy web

on:
  push:
    branches: [work]
  workflow_dispatch:

concurrency:
  group: deploy-web-work
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy web on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /root/MediNexPlus
            git fetch origin work
            git checkout work
            git pull --ff-only origin work
            bash scripts/deploy-web.sh
